name: CI

# Builds the solution and runs WorkItemManagement.Core.Tests on every pull request and on every
# push to main (#11). Before this, nothing in this repository ran a test: a change here could only
# fail at the next version bump in a consuming repository, after it had been published.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # #17: DomainServices.Core restores from the anonymous Sleet feed through the committed
      # nuget.config, so no feed credential is needed.
      - name: Test
        run: dotnet test WorkItemManagement.slnx -c Release
